blueprint_name: sc25-slurm-gpu

vars:
  project_id: nersc-sc25-demo
  deployment_name: sc25-workshop
  region: us-central1
  zone: us-central1-a

deployment_groups:
# Build custom image
- group: packer
  modules:
  - id: custom_image
    source: modules/packer/custom-image
    kind: packer
    settings:
      source_image_family: slurm-gcp-6-11-hpc-rocky-linux-8
      source_image_project_id: [schedmd-slurm-public]
      image_family: sc25-workshop-slurm
      disk_size: 50
      zone: $(vars.zone)
      # Use default VPC for building the image
      subnetwork_name: default
      omit_external_ip: false  # Need internet to download packages
      # Don't use startup_script - it overwrites Slurm's
      # Use shell_scripts instead (runs during Packer build only)
      shell_scripts:
        - $(ghpc_stage("./setup/install-software.sh"))
        - $(ghpc_stage("./setup/configure-ondemand-cluster.sh"))
        - $(ghpc_stage("./setup/create-users.sh"))


# Deploy cluster with custom image
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: private_service_access
    source: community/modules/network/private-service-access
    use: [network]

  - id: homefs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /home

  - id: sharedfs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /shared
      size_gb: 1024

  - id: ns_t4_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 32
      node_count_static: 8
      disk_type: pd-standard
      machine_type: n1-standard-8
      guest_accelerator:
        - type: nvidia-tesla-t4
          count: 4
      enable_placement: false
      preemptible: false
      dws_flex:
        enabled: true
        max_run_duration: 300000
      # zones: [us-central1-b, us-central1-c, us-central1-f]
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: part_t4_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - ns_t4_dws
    settings:
      partition_name: t4dws
      exclusive: false
      is_default: true

  - id: ns_v100_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 16
      node_count_static: 8
      disk_type: pd-standard
      machine_type: n1-standard-8
      guest_accelerator:
        - type: nvidia-tesla-v100
          count: 4
      enable_placement: false
      preemptible: false
      dws_flex:
        enabled: true
        max_run_duration: 300000
      instance_image_custom: true
      # zones: [us-central1-b, us-central1-c, us-central1-f]
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: part_v100_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - ns_v100_dws
    settings:
      partition_name: v100dws
      exclusive: false
      is_default: false

