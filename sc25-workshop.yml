blueprint_name: sc25-slurm-gpu

vars:
  project_id: nersc-sc25-demo
  deployment_name: sc25-workshop
  region: us-central1
  zone: us-central1-a
  instance_image:
    name: sc25-r8-2
    project: $(vars.project_id)
    disk_size: 50

deployment_groups:
# Custom image baking has been moved to packer. Packer uses exactly the same
# scripts as the ones below, but packer allows us to version the images. --
# uncomment this block to put it back in
