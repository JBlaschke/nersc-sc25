blueprint_name: sc25-slurm-gpu

vars:
  project_id: nersc-sc25-demo
  deployment_name: sc25-workshop
  region: us-central1
  zone: us-central1-a

deployment_groups:
# Build custom image
- group: packer
  modules:
  - id: custom_image
    source: modules/packer/custom-image
    kind: packer
    settings:
      source_image_family: slurm-gcp-6-5-hpc-rocky-linux-8
      source_image_project_id: [schedmd-slurm-public]
      image_family: sc25-workshop-slurm
      disk_size: 50
      zone: $(vars.zone)
      # Use default VPC for building the image
      subnetwork_name: default
      omit_external_ip: false  # Need internet to download packages
      use_iap: false
      shell_scripts: |
        #!/bin/bash
        set -xeuo pipefail

        exec > >(tee /var/log/ondemand-install.log)
        exec 2>&1

        echo "Installing Open OnDemand..."

        # Enable required modules for OnDemand
        dnf module reset nodejs ruby -y
        dnf module enable nodejs:20 ruby:3.3 -y
        dnf module install nodejs:20 ruby:3.3 -y

        # Install OnDemand repository
        dnf install -y https://yum.osc.edu/ondemand/latest/ondemand-release-web-latest-1-6.noarch.rpm

        # Install OnDemand and tools
        dnf install -y ondemand git vim tmux htop

        # Configure OnDemand
        /opt/ood/ood-portal-generator/sbin/update_ood_portal

        # Enable and start Apache (use 'httpd' not 'httpd24-httpd')
        systemctl enable httpd
        systemctl start httpd

        # Configure firewall
        firewall-cmd --permanent --add-service=http 2>/dev/null || true
        firewall-cmd --permanent --add-service=https 2>/dev/null || true
        firewall-cmd --reload 2>/dev/null || true

        echo "Open OnDemand installation complete!"
        EOF


# Deploy cluster with custom image
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: private_service_access
    source: community/modules/network/private-service-access
    use: [network]

  - id: homefs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /home

  - id: sharedfs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /shared
      size_gb: 1024

  - id: static_gpu_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_static: 2
      machine_type: g2-standard-4
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: dynamic_gpu_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 2
      machine_type: g2-standard-4
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: static_gpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [static_gpu_nodeset]
    settings:
      partition_name: staticgpu
      exclusive: false
      is_default: true

  - id: dynamic_gpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [dynamic_gpu_nodeset]
    settings:
      partition_name: dynamicgpu
      exclusive: false

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n2-standard-8
      enable_login_public_ips: true
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - static_gpu_partition
    - dynamic_gpu_partition
    - homefs
    - sharedfs
    - slurm_login
    settings:
      enable_controller_public_ips: true
