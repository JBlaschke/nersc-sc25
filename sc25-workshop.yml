#       subnetwork_name: default
#       omit_external_ip: false  # Need internet to download packages
#       # Don't use startup_script - it overwrites Slurm's
#       # Use shell_scripts instead (runs during Packer build only)
#       shell_scripts:
#         - $(ghpc_stage("./setup/install-software.sh"))
#         - $(ghpc_stage("./setup/configure-ondemand-cluster.sh"))
#         - $(ghpc_stage("./setup/create-users.sh"))


# Deploy cluster with custom image
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: private_service_access
    source: community/modules/network/private-service-access
    use: [network]

  - id: homefs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /home

  - id: sharedfs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /shared
      size_gb: 1024

  - id: ns_t4_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 24
      node_count_static: 8
      disk_type: pd-standard
      machine_type: n1-standard-8
      guest_accelerator:
        - type: nvidia-tesla-t4
          count: 4
      enable_placement: false
      preemptible: false
      dws_flex:
        enabled: true
        max_run_duration: 300000
      # zones: [us-central1-b, us-central1-c, us-central1-f]
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: part_t4_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - ns_t4_dws
    settings:
      partition_name: t4dws
      exclusive: false
      is_default: true

  - id: ns_v100_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 4
      node_count_static: 4
      disk_type: pd-standard
      machine_type: n1-standard-8
      guest_accelerator:
        - type: nvidia-tesla-v100
          count: 4
      enable_placement: false
      preemptible: false
      dws_flex:
        enabled: true
        max_run_duration: 300000
      instance_image_custom: true
      # zones: [us-central1-b, us-central1-c, us-central1-f]
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: part_v100_dws
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - ns_v100_dws
    settings:
      partition_name: v100dws
      exclusive: false
      is_default: false

  - id: ns_v100_dws_8
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 2
      node_count_static: 2
      disk_type: pd-standard
      machine_type: n1-standard-8
      guest_accelerator:
        - type: nvidia-tesla-v100
          count: 8
      enable_placement: false
      preemptible: false
      dws_flex:
        enabled: true
        max_run_duration: 300000
      instance_image_custom: true
      # zones: [us-central1-b, us-central1-c, us-central1-f]
      allow_automatic_updates: false
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: part_v100_dws_8
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - ns_v100_dws_8
    settings:
      partition_name: v100dws8
      exclusive: false
      is_default: false


  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n1-standard-32
      disk_type: pd-standard
      enable_login_public_ips: true
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - part_t4_dws
    - part_v100_dws
    - part_v100_dws_8
    - homefs
    - sharedfs
    - slurm_login
    settings:
      enable_controller_public_ips: true
      instance_image:
        family: sc25-workshop-slurm
        project: $(vars.project_id)
